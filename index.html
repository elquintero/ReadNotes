/* Autorrecuperación: si la app no ha terminado de arrancar en 15 s (página cortada a medias al despertar el móvil, red caída...), se recarga sola; como máximo 2 veces seguidas. */
setTimeout(function () {
  if (window.__rnReady) return;
  try { var n = +sessionStorage.getItem("rn_retry") || 0; if (n >= 2) return; sessionStorage.setItem("rn_retry", String(n + 1)); } catch (e) {}
  var m = document.getElementById("splashMsg"); if (m) m.textContent = "Reintentando…";
  location.reload();
}, 15000);

const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb2hex = (r, g, b) => "#" + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");
const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
const rgbaHex = (h, a) => { const c = hex2rgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };
const lum = (h) => { const c = hex2rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
function hslOf(h) {
  const [r, g, b] = hex2rgb(h).map((v) => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(hh * 60 + 360) % 360, s, l];
}
function hslHex(h, s, l) {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgb2hex(f(0) * 255, f(8) * 255, f(4) * 255);
}

function applyTheme() {

const accA = (a) => rgbaHex(AC.accV, a);                           // el acento con transparencia (resaltes)
function applyAccent() {
  applyTheme();
  const base = ACCENTS[clamp(int(S.accent, 0), 0, ACCENTS.length - 1)][1], dark = lum(base) < 0.06, lt = AC.light;
  AC.acc = base;  AC.bar = base;                                   // la barra superior ES el acento
  AC.accV = lt ? base : dark ? mixHex(base, "#ffffff", 0.4) : base;   // oscuro: el negro se aclara · claro: el acento tal cual
  AC.accT = lt ? (lum(base) > 0.28 ? mixHex(base, "#000000", 0.3) : base) : mixHex(AC.accV, "#ffffff", dark ? 0.25 : 0.38);   // texto pequeño legible sobre el fondo del tema
  AC.accH = lt ? (dark ? mixHex(base, "#ffffff", 0.22) : mixHex(base, "#000000", 0.12)) : mixHex(AC.accV, "#ffffff", 0.2);       // al pasar el puntero
  AC.accBg = lt ? mixHex(base, "#ffffff", 0.88) : mixHex(AC.accV, "#212121", 0.78);   // fondos teñidos (cartel de actualización)
  AC.accP = lum(base) > 0.28 ? mixHex(base, "#000000", 0.3) : (dark ? "#222222" : base);   // acento sobre el papel blanco (tema claro): se oscurece si es claro
  // texto sobre el acento: se elige blanco u oscuro según cuál contraste más
  const pickText = (bg, light, darkC) => (1.05 / (lum(bg) + 0.05) >= (lum(bg) + 0.05) / (lum(darkC) + 0.05) ? light : darkC);

}

function loadSettings() {

{ // niveles de notas por clave; si el usuario venía de las "líneas adicionales" se conserva su rango equivalente

  S.skin = raw.skin === 1 ? 1 : 0;

/* ---------- .mxl = ZIP con el MusicXML dentro ---------- */
async function unzipEntry(buf, wanted) {
  if (typeof DecompressionStream === "undefined") throw new Error("este navegador no puede abrir .mxl");
  const dv = new DataView(buf), u8 = new Uint8Array(buf), ents = [];
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65600); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("no es un .mxl válido");
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    ents.push({ name: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl)), method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), lho: dv.getUint32(p + 42, true) });
    p += 46 + nl + el + cl;
  }
  const read = async (en) => {
    const start = en.lho + 30 + dv.getUint16(en.lho + 26, true) + dv.getUint16(en.lho + 28, true), data = u8.subarray(start, start + en.csize);
    if (en.method === 0) return new TextDecoder().decode(data);
    if (en.method !== 8) throw new Error("compresión no admitida");
    const st = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(st).arrayBuffer());
  };
  return wanted(ents, read);
}
async function xmlFromMxl(buf) {
  return unzipEntry(buf, async (ents, read) => {
    const find = (nm) => ents.find((x) => x.name.toLowerCase() === nm.toLowerCase());
    let path = "";
    const c = find("META-INF/container.xml");
    if (c) { const m = /full-path="([^"]+)"/.exec(await read(c)); if (m) path = m[1]; }
    let en = path ? find(path) : null;
    if (!en) en = ents.find((x) => !/^META-INF\//i.test(x.name) && /\.(xml|musicxml)$/i.test(x.name));
    if (!en) throw new Error("el .mxl no contiene partitura");
    return read(en);
  });
}

/* ---------- MusicXML (partwise): se lee la voz en clave de sol ---------- */
function parseMusicXML(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("fichero MusicXML no válido");
  if (doc.documentElement.nodeName !== "score-partwise") throw new Error("solo se admite MusicXML «partwise»");
  const tx = (el, tag) => { const x = el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ""; };
  let bpm = 0;
  for (const s of doc.getElementsByTagName("sound")) { const t = parseFloat(s.getAttribute("tempo")); if (t > 0) { bpm = t; break; } }
  if (!bpm) { const pm = parseFloat(tx(doc, "per-minute")); if (pm > 0) bpm = pm; }
  const STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  for (const part of doc.getElementsByTagName("part")) {
    let sign = "";
    for (const c of part.getElementsByTagName("clef")) { const nn = c.getAttribute("number"); if (!nn || nn === "1") { sign = tx(c, "sign"); break; } }
    if (sign && sign !== "G") continue;                    // de momento solo clave de sol
    let div = 1, voice = null;
    const notes = [];
    for (const meas of part.children) {
      if (meas.nodeName !== "measure") continue;
      for (const el of meas.children) {
        if (el.nodeName === "attributes") { const d = parseFloat(tx(el, "divisions")); if (d > 0) div = d; continue; }
        if (el.nodeName !== "note" || el.getElementsByTagName("grace").length || el.getElementsByTagName("rest").length) continue;
        const st = tx(el, "staff");
        if (st && st !== "1") continue;
        const pe = el.getElementsByTagName("pitch")[0];
        if (!pe || STEP[tx(pe, "step")] === undefined) continue;
        const v = tx(el, "voice") || "1";
        if (voice === null) voice = v;
        if (v !== voice) continue;
        const step = (parseInt(tx(pe, "octave"), 10) - 4) * 7 + STEP[tx(pe, "step")];
        const alt = Math.sign(parseFloat(tx(pe, "alter")) || 0);
        const beats = (parseFloat(tx(el, "duration")) || div) / div;
        const last = notes[notes.length - 1];
        if (el.getElementsByTagName("chord").length) { if (last && step > last.step) { last.step = step; last.alt = alt; } continue; }   // acordes: la nota más aguda
        let tieStop = false;
        for (const t of el.getElementsByTagName("tie")) if (t.getAttribute("type") === "stop") tieStop = true;
        if (tieStop && last && last.step === step) { last.beats += beats; continue; }                                                   // ligadura: suma duración
        notes.push({ step, beats, alt });
      }
    }
    if (notes.length) return { title: tx(doc, "work-title") || tx(doc, "movement-title"), bpm: bpm || 90, notes };
  }

}

{

function importStats() {

      const key = (s) => s.t + "_" + s.m + "_" + s.n.length, have = new Set(sessions.map(key));

}

/* ---------- racha de días y objetivo diario ---------- */
function dayIdx(t) { const d = new Date(t); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function streakInfo() {
  const days = new Map();
  for (const s of sessions) { const k = dayIdx(s.t);  days.set(k, (days.get(k) || 0) + s.n.length); }
  const today = dayIdx(Date.now());
  let cur = 0, k = days.has(today) ? today : today - 1;
  while (days.has(k)) { cur++;  k--; }
  let best = 0, run = 0, prev = null;
  for (const d of [...days.keys()].sort((a, b) => a - b)) { run = prev !== null && d === prev + 1 ? run + 1 : 1;  best = Math.max(best, run);  prev = d; }
  return { cur, best, today: days.get(today) || 0, alive: days.has(today) };
}
function fmtTime(ms) {
  const s = Math.round(ms / 1000);
  if (s >= 3600) return Math.floor(s / 3600) + " h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + " min";   // más de una hora
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function periodCutoff(p) {

  return d.getTime() - (lim - 1) * 86400000;
}

/* ---------- estadísticas globales: cálculo ---------- */
function computeStats() {
  const cut = periodCutoff(ST.period), list = sessions.filter((s) => s.t >= cut);
  const clefs = ST.clef < 0 ? [0, 1] : [ST.clef];
  const dm = new Map(), nm = new Map(), all = [];
  let ns = 0;
  for (const s of list) {
    let used = false, day = null;
    for (const e of s.n) {
      if (ST.clef >= 0 && e[0] !== ST.clef) continue;
      if (!day) {
        const k = new Date(s.t).setHours(0, 0, 0, 0);
        day = dm.get(k);
        if (!day) { day = { t: k, arr: [[], []] }; dm.set(k, day); }
      }
      used = true;
      day.arr[e[0]].push(e);  all.push(e);
      const key = e[0] + "_" + e[1];
      let a = nm.get(key);
      if (!a) { a = { clef: e[0], step: e[1], n: 0, bad: 0, ms: 0 }; nm.set(key, a); }
      a.n++;  a.bad += e[2];  a.ms += e[3];
    }
    if (used) ns++;
  }
  const days = [...dm.values()].sort((a, b) => a.t - b.t).map((d) => ({ t: d.t, a: [aggOf(d.arr[0]), aggOf(d.arr[1])] }));
  SD = { clefs, days, all: aggOf(all), notes: [...nm.values()], sessions: ns, rvN: reviewInfo(clefs).nWeak };
}

/* ---------- estadísticas globales: dibujo ---------- */
function drawChart(x, y, w, h) {
  panel(x, y, w, h);

  const lm = 46, rm = 16, tm = 16, bm = 28, px = x + lm, py = y + tm, pw = w - lm - rm, ph = h - tm - bm;
  const m = ST.metric, days = SD.days, per = ST.period, cut = periodCutoff(per);
  const nX = per < 2 ? (per === 0 ? 7 : 30) : Math.max(days.length, 1);
  const val = (a) => (m === 0 ? a.acc * 100 : m === 1 ? a.nps : a.n);
  const series = SD.clefs.map((c) => ({
    c,
    pts: days.map((d, i) => (d.a[c].n ? { i: per < 2 ? Math.round((d.t - cut) / 86400000) : i, v: val(d.a[c]) } : null)).filter(Boolean)
  }));
  let mx = 0;
  for (const s of series) for (const p of s.pts) mx = Math.max(mx, p.v);
  const ymax = m === 0 ? 100 : niceMax(Math.max(0.1, mx * 1.1));
  const fy = (v) => (m === 0 ? Math.round(v) + "%" : String(Math.round(v * 100) / 100));
  const fsz = 11;
  for (let g = 0; g <= 4; g++) {
    const gy = py + ph - (g / 4) * ph;
    line(px, gy, px + pw, gy, AC.grid, 1);
    text(fy((ymax * g) / 4), px - 8, gy, fsz, AC.dim, "right");
  }
  const xp = (i) => px + ((i + 0.5) / nX) * pw;
  const maxLab = Math.max(1, Math.floor(pw / 44)), stepL = Math.ceil(nX / maxLab);
  for (let i = 0; i < nX; i += stepL) {
    let dd;
    if (per < 2) { dd = new Date(cut);  dd.setDate(dd.getDate() + i); }
    else dd = new Date(days[i] ? days[i].t : cut);
    text(dd.getDate() + "/" + (dd.getMonth() + 1), xp(i), py + ph + 15, fsz, AC.dim, "center");
  }

    ctx.fillStyle = col;

  }
}

  {                                                        // racha y objetivo de hoy (no dependen de los filtros)
    const si = streakInfo(), sg = 10, scw = (w - sg) / 2, sch = clamp(w * 0.19, 62, 80);
    statCard(x, y, scw, sch, "Racha actual", si.cur + (si.cur === 1 ? " día" : " días"), si.alive ? "¡Hoy ya has practicado!" : si.cur ? "Practica hoy para mantenerla" : "Practica hoy para empezar", si.alive ? AC.ok : AC.dim, si.cur ? AC.accT : AC.txt);
    statCard(x + scw + sg, y, scw, sch, "Mejor racha", si.best + (si.best === 1 ? " día" : " días"), "", AC.dim, AC.txt);
    y += sch + sg;
    const oh = clamp(w * 0.22, 74, 92), done = S.goal > 0 && si.today >= S.goal;
    panel(x, y, w, oh);
    text("Objetivo de hoy", x + 14, y + oh * 0.24, clamp(oh * 0.16, 11, 13), AC.dim, "left");
    text(S.goal ? si.today + " / " + S.goal + " notas" : si.today + (si.today === 1 ? " nota" : " notas"), x + w - 14, y + oh * 0.24, clamp(oh * 0.2, 13, 16), done ? AC.ok : AC.txt, "right", "bold");
    if (S.goal) {
      const bx = x + 14, bw2 = w - 28, by = y + oh * 0.46, bh2 = 10;
      ctx.fillStyle = AC.trough;  rr(bx, by, bw2, bh2, 5);  ctx.fill();
      if (si.today > 0) { ctx.fillStyle = done ? AC.ok : AC.accV;  rr(bx, by, Math.max(bh2, bw2 * Math.min(1, si.today / S.goal)), bh2, 5);  ctx.fill(); }
      text(done ? "¡Objetivo cumplido!" : "Te faltan " + (S.goal - si.today) + " notas", x + 14, y + oh * 0.8, clamp(oh * 0.16, 11, 13), done ? AC.ok : AC.dim, "left");
    } else text("Define un objetivo diario en Ajustes", x + 14, y + oh * 0.7, clamp(oh * 0.16, 11, 13), AC.dim, "left");
    y += oh + pad * 1.4;
  }
  const segH = clamp(w * 0.1, 38, 46), lblW = w * 0.2;
  text("Clave", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, [ti("Todas", "All"), ti("Sol", "Treble"), ti("Fa", "Bass")], ST.clef + 1, "tf_", [-1, 0, 1]);
  y += segH + 10;
  text("Periodo", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, ["7 días", "30 días", "Todo"], ST.period, "tp_", [0, 1, 2]);
  y += segH + pad;
  const A = SD.all;
  if (!A.n) {
    const eh = clamp(w * 0.5, 150, 220);
    panel(x, y, w, eh);
    text("Aún no hay datos", x + w / 2, y + eh * 0.38, clamp(w * 0.055, 18, 24), AC.txt, "center", "", w - 20);
    text("Completa una sesión para ver aquí tu progreso", x + w / 2, y + eh * 0.58, fs, AC.dim, "center", "", w - 20);
    y += eh + pad;
  } else {
    // tarjetas
    const gap = 10, cw = (w - gap) / 2, ch = clamp(w * 0.19, 62, 80);
    const cards = [
      ["Sesiones", String(SD.sessions), AC.txt],
      ["Notas leídas", String(A.n), AC.txt],
      ["Precisión", Math.round(A.acc * 100) + "%", accCol(A.acc)],
      ["Notas por segundo", A.nps.toFixed(2), AC.txt],
      ["Tiempo por nota", A.avg.toFixed(1) + " s", AC.txt],
      ["Tiempo jugado", fmtTime(A.ms), AC.txt]
    ];
    cards.forEach((c, i) => statCard(x + (i % 2) * (cw + gap), y + Math.floor(i / 2) * (ch + gap), cw, ch, c[0], c[1], "", AC.dim, c[2]));
    y += 3 * ch + 2 * gap + pad * 1.4;
    if (SD.rvN > 0) {
      const rbh = clamp(w * 0.12, 44, 54);
      actionBtn(x, y, w, rbh, "Repasar mis fallos · " + SD.rvN + (SD.rvN === 1 ? " nota" : " notas"), true, hoverBtn === "t_review");
      addHit("t_review", x, y, w, rbh);
      y += rbh + pad * 1.4;
    }
    // gráfico
    const names = ["PRECISIÓN", "NOTAS POR SEGUNDO", "NOTAS PRACTICADAS"];
    text(names[ST.metric], x + w / 2, y, clamp(fs, 12, 15), AC.txt, "center", "bold");
    y += fs * 1.2;
    text("Pulsa en el gráfico para alternar entre estadísticas", x + w / 2, y, clamp(fs * 0.85, 11, 13), AC.dim, "center", "", w);
    y += fs * 1.1;
    const gh = clamp(w * 0.62, 200, 300);
    drawChart(x, y, w, gh);
    y += gh + 12;
    if (ST.clef < 0) {
      const lx = x + w / 2 - 110;
      [0, 1].forEach((c, i) => {
        ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(lx + i * 120 + 6, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
        text(MODE_NAME[c], lx + i * 120 + 18, y + 8, 12, AC.dim, "left");
      });
      y += 24;
    }
    y += pad;
    {                                                      // notas más difíciles (por fallos y, si no hay, por tiempo)
      const hard = SD.notes.filter((a) => a.n + a.bad >= 3).map((a) => ({ a, er: a.bad / (a.n + a.bad), tm: a.ms / a.n / 1000 })).sort((p, q) => q.er - p.er || q.tm - p.tm).slice(0, 5);
      if (hard.length) {
        text(hard.every((h) => h.er === 0) ? "NOTAS MÁS LENTAS" : "NOTAS MÁS DIFÍCILES", x + 2, y + 6, 12, AC.dim, "left", "bold");
        y += 24;
        const hr = clamp(w * 0.1, 40, 48);
        panel(x, y, w, hr * hard.length);
        hard.forEach(({ a, er, tm }, i) => {
          const ry = y + hr * i + hr / 2;
          if (i) line(x + 12, y + hr * i, x + w - 12, y + hr * i, AC.line, 1);
          ctx.fillStyle = clefCol(a.clef);  ctx.beginPath();  ctx.arc(x + 20, ry, 5, 0, Math.PI * 2);  ctx.fill();
          text(noteLabel(a.step), x + 36, ry, fs + 2, AC.txt, "left", "bold");
          text(a.bad ? a.bad + (a.bad === 1 ? " fallo" : " fallos") + " de " + (a.n + a.bad) : a.n + " veces", x + w * 0.66, ry, fs, er > 0 ? AC.bad : AC.dim, "right");
          text(tm.toFixed(1) + " s", x + w - 14, ry, fs, AC.dim, "right");
        });
        y += hr * hard.length + pad * 1.2;
      }
    }
    // notas
    const rh = clamp(w * 0.085, 38, 46);
    for (const c of SD.clefs) {
      const arr = SD.notes.filter((n) => n.clef === c).sort((a, b) => a.step - b.step);
      if (!arr.length) continue;
      ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(x + 8, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
      text(MODE_NAME[c].toUpperCase(), x + 20, y + 8, 12, AC.dim, "left", "bold");
      y += 24;
      text("Nota", x + 14, y + 6, 11, AC.dim, "left");
      text("Veces", x + w * 0.42, y + 6, 11, AC.dim, "right");
      text("Tiempo", x + w * 0.7, y + 6, 11, AC.dim, "right");
      text("Acierto", x + w - 14, y + 6, 11, AC.dim, "right");
      y += 18;
      panel(x, y, w, rh * arr.length);
      arr.forEach((a, i) => {
        const ry = y + rh * i + rh / 2, acc = a.n / (a.n + a.bad);
        if (i) line(x + 12, y + rh * i, x + w - 12, y + rh * i, AC.line, 1);
        text(noteLabel(a.step), x + 14, ry, fs + 2, AC.txt, "left", "bold");
        text(String(a.n), x + w * 0.42, ry, fs, AC.dim, "right");
        text((a.ms / a.n / 1000).toFixed(1) + " s", x + w * 0.7, ry, fs, AC.dim, "right");
        text(Math.round(acc * 100) + "%", x + w - 14, ry, fs + 2, accCol(acc), "right", "bold");
      });
      y += rh * arr.length + pad * 1.2;
    }
  }
  maxScroll = Math.max(0, y + scrollY - L.vh);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
}

function draw(t) {
ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
sceneHits = [];
if (settingsOpen) { drawSettings(); return; }
if (scene === "game") {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
drawBar(reviewOn ? "Repasar fallos" : playMode === 5 && mel ? mel.title : timed ? "Contrarreloj" : MODE_NAME[playMode], { back: "back", actions: [{ id: "reset", icon: "reset" }, { id: "open", icon: "gear" }] });
drawHeaderDark();
drawStaff();
drawNotes();
drawMessage();
drawMicHint();
if (L.kb) drawKeyboard(); else drawWheel();
} else {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
if (scene === "menu") drawMenu(t);
else if (scene === "clefs") drawClefs();
else if (scene === "melodies") drawMelodies();
else if (scene === "summary") drawSummary();
else if (scene === "stats") drawStats();
drawUpdateBanner();
}
drawToast();
}
let last = performance.now(), lastW = 0, lastH = 0;
function frame(t) {
const dt = Math.min(0.05, (t - last) / 1000);
last = t;
if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth;  lastH = innerHeight;  onResize(); }   // por si el sistema no avisó del cambio de tamaño
const moving = update(dt);
if (finishAt && performance.now() >= finishAt) { finishAt = 0; finishSession(); }
buildUI();
const hi = settingsOpen || scene !== "game" || L.kb ? -1 : wheelIndex(pointer);
let hb = "";
for (const b of buttons) if (hit(b, pointer)) { hb = b.id; break; }
if (hi !== hoverIdx || hb !== hoverBtn) { hoverIdx = hi; hoverBtn = hb; dirty = true; }
if (moving || dirty || (trans && !trans.started)) { drawFrame(t); dirty = false; }
requestAnimationFrame(frame);
}
function onResize() { if (trans) endTrans();  layout(); dirty = true; }
addEventListener("resize", onResize);
addEventListener("pageshow", () => { onResize(); });
addEventListener("orientationchange", () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
document.addEventListener("fullscreenchange", onResize);
document.addEventListener("webkitfullscreenchange", onResize);
function start() {
loadSettings();
loadSessions();
layout();
syncHist();
if (S.midi) initMidi();
requestAnimationFrame(frame);
}
let booted = false;
const boot = () => {
  if (booted) return;  booted = true;
  const t0 = performance.now(), sp = document.getElementById("splash"), fill = document.getElementById("splashFill"), msgEl = document.getElementById("splashMsg");
  const setP = (p, t) => { if (fill) fill.style.width = Math.round(p * 100) + "%"; if (msgEl && t !== undefined) msgEl.textContent = tr(t); };
  try {
    loadSettings();  if (fill) fill.style.background = AC.acc;
  } catch (e) {}          // la barra usa el color de acento elegido
  setP(0.3, "Descargando fuentes…");
  let okFont = true;
  const fontP = document.fonts && document.fonts.load
    ? document.fonts.load("40px Bravura", "\uE050\uE062\uE1D5\uE1D6").then((fs) => { okFont = !!(fs && fs.length); }, () => { okFont = false; })
    : Promise.resolve();
  Promise.race([fontP, new Promise((r) => setTimeout(r, 6000))]).then(() => {
    setP(0.85, okFont ? "Preparando…" : "No se encontró fonts/Bravura.otf: se usa una fuente de reserva");
    const wait = Math.max(0, (okFont ? 900 : 2400) - (performance.now() - t0));      // el logo se ve al menos ~1 s
    setTimeout(() => {
      try { start(); } catch (e) { console.error(e); }
      try { (window.requestIdleCallback || setTimeout)(() => { try { ensureC(); } catch (e) {} }, 1500); } catch (e) {}
      window.__rnReady = true;  try { sessionStorage.removeItem("rn_retry"); } catch (e) {}
      setP(1, "");
      if (sp) { sp.classList.add("off");  setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450); }
    }, wait);
  });
};
addEventListener("load", boot);
setTimeout(boot, 4000);                                    // si "load" tarda (red lenta), se arranca igualmente
</script>
<style>
@font-face {
  font-family: Bravura;
  src: url("fonts/Bravura.otf") format("opentype"), url("Fonts/Bravura.otf") format("opentype");
}
</style>
</body>
