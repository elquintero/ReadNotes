<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
"use strict";
const NAMES_ES = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
const NAMES_EN = ["C", "D", "E", "F", "G", "A", "B"];
const SEMITONES = [0, 2, 4, 5, 7, 9, 11];
const G_CLEF = 0xE050, F_CLEF = 0xE062, QUARTER_UP = 0xE1D5, QUARTER_DOWN = 0xE1D6;
const BOTTOM_SOL = 2, BOTTOM_FA = -10;
const PENDING = 12;
const MAX_W   = 1100;
// ---------- constantes nuevas ----------
const APP_NAME = "ReadNotes", APP_VER = "1.0", SESSION_N = 32, CLEF_GAP = 0.55;
const MODE_NAME = ["Clave de sol", "Clave de fa", "Claves mezcladas"];
const AC = {
  bg: "#212121", card: "#2a2a2a", edge: "#3c3c3c", txt: "#e2e2e2", dim: "#8d8d8d",
  cyan: "#2ed3e6", amber: "#ffb454", ok: "#4ade80", mid: "#f5c542", bad: "#ff6b6b", bar: "#2a6f86"
};
const clefCol = (c) => (c === 1 ? AC.amber : AC.cyan);
const C = {
bg: "#141721",   ink: "#1a1a21",  paper: "#f5f0e0", ui: "#edf0f7",
cur: "#1a61eb",  ok: "#149440",   bad: "#d92626",
gold: "#ffd966", dim: "#b3bfd9",  btn: "#33384d",   btnOn: "#4073d9", line: "#808cb3"
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const int   = (v, d) => (Number.isFinite(+v) ? Math.round(+v) : d);
const mod   = (a, n) => ((a % n) + n) % n;
const rand  = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const S = {
mode: 0,
lg: 1,
lf: 1,
visible: 6,
es: true,
sound: true,
vol: 7,
haptic: true,
midi: false,
skin: 0,
rec: 0
};
function loadSettings() {
try {
const raw = JSON.parse(localStorage.getItem("mrt") || "{}");
S.mode   = clamp(int(raw.mode, 0), 0, 2);
S.lg = clamp(int(raw.lg !== undefined ? raw.lg : raw.above, 1), 0, 4);
S.lf = clamp(int(raw.lf !== undefined ? raw.lf : raw.above, 1), 0, 4);
S.visible = clamp(int(raw.visible, 6), 3, 8);
S.es     = raw.es !== false;
S.sound  = raw.sound !== false;
S.vol    = clamp(int(raw.vol, 7), 0, 10);
S.haptic = raw.haptic !== false;
  S.skin = raw.skin === 1 ? 1 : 0;
S.midi = raw.midi === true;
S.rec    = Math.max(0, int(raw.rec, 0));
} catch (e) {  }
}
function saveSettings() {
try { localStorage.setItem("mrt", JSON.stringify(S)); } catch (e) {}
}
const bottomStep = (c) => (c === 1 ? BOTTOM_FA : BOTTOM_SOL);
const linesOf    = (c) => (c === 1 ? S.lf : S.lg);
const lowStep    = (c) => bottomStep(c) - 1 - 2 * linesOf(c);
const highStep   = (c) => bottomStep(c) + 9 + 2 * linesOf(c);
const cv  = document.getElementById("c");
const ctx = cv.getContext("2d");
let L = {};
function safeArea() {
const cs = getComputedStyle(document.getElementById("safe"));
return {
t: parseFloat(cs.paddingTop) || 0,    r: parseFloat(cs.paddingRight) || 0,
b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0
};
}
function noteGeometry() {
const n = S.visible;
const first = S.skin === 1 ? 9.4 : 5.3;
const gap = S.skin === 1 ? 3.3 : (n <= 4 ? 3.4 : 3.0);
return { first, gap, fit: first + (n - 1) * gap + (S.skin === 1 ? 4 : 2.3) };
}
const extraLines = () => (S.mode === 0 ? S.lg : S.mode === 1 ? S.lf : Math.max(S.lg, S.lf));
function extents() {
return {
up:   Math.max(4.5 + extraLines(), 4.9) + 1.0,
down: Math.max(0.5 + extraLines(), 1.4) + 1.0
};
}
function layout() {
const vv = window.visualViewport;
const vw = Math.max(200, Math.round(vv ? vv.width  : innerWidth));
const vh = Math.max(200, Math.round(vv ? vv.height : innerHeight));
const dpr = Math.min(window.devicePixelRatio || 1, 3);
cv.style.width  = vw + "px";  cv.style.height = vh + "px";
cv.width = Math.round(vw * dpr);  cv.height = Math.round(vh * dpr);
const sa = safeArea();
const availW = vw - sa.l - sa.r;
const cw  = Math.min(availW, MAX_W);
const cx0 = sa.l + (availW - cw) / 2;
const top = sa.t, bot = vh - sa.b;
const land = vw > vh * 1.15;
const base   = Math.min(cw, vh);
const m      = clamp(Math.round(base * 0.025), 6, 20);
const btnH   = clamp(Math.round(base * 0.09), 36, 48);
const fs     = clamp(Math.round(base * 0.034), 12, 17);
const titleFs = clamp(Math.round(base * 0.055), 18, 30);
const ext = extents(), total = ext.up + ext.down;
const geo = noteGeometry();
const msgH = clamp(Math.round(vh * 0.06), 28, 44);
const barH = clamp(Math.round(vh * 0.075), 50, 60);
const hh = S.skin === 1 ? barH + Math.round(fs * 2.3)
  : land ? barH + Math.round(fs * 2.3)
  : barH + Math.round(m * 0.4 + titleFs * 1.2 + fs * 2.9 + m * 0.5);
let sp, paper, wheelD, wheelCx, wheelCy, msgX, msgY, ringR = null;
if (!land) {
const innerW = cw - 2 * m;
sp = clamp(innerW / geo.fit, 10, 36);
const minWheel = Math.min(innerW, vh * 0.36);
let avail;
for (;;) {
avail = (bot - top) - hh - total * sp - msgH - m * 2;
if (avail >= minWheel || sp <= 10) break;
sp -= 0.5;
}
wheelD = clamp(Math.min(innerW, avail), 90, 560);
paper = { x: cx0 + m, y: top + hh, w: innerW, h: total * sp };
msgX = cx0 + cw / 2;  msgY = paper.y + paper.h + msgH / 2;
const regionTop = paper.y + paper.h + msgH, regionBot = bot - m;
wheelCx = cx0 + cw / 2;
wheelCy = regionTop + (regionBot - regionTop) / 2;

wheelD = clamp(Math.min((bot - top) - hh - m * 2, cw * 0.42), 100, 560);
const leftW  = cw - wheelD - m * 3;
const availH = (bot - top) - hh - msgH - m * 2;
sp = clamp(Math.min(leftW / geo.fit, availH / total), 10, 36);
const groupH = total * sp + msgH;
const py = top + hh + Math.max(0, ((bot - top) - hh - groupH) / 2 - m * 0.5);
paper = { x: cx0 + m, y: py, w: leftW, h: total * sp };
msgX = paper.x + paper.w / 2;  msgY = paper.y + paper.h + msgH / 2;
wheelCx = cx0 + cw - m - wheelD / 2;
wheelCy = top + hh + ((bot - top) - hh) / 2;
}
if (S.skin === 1) {
  if (!land) {
    const t2 = paper.y + paper.h + msgH;
    ringR = Math.max(40, Math.min(cw * 0.375, (bot - t2 - m) / 2 * 0.8));
    wheelCx = cx0 + cw / 2;
    wheelCy = Math.max(t2 + ringR * 1.15, bot - Math.max(m * 2, vh * 0.045) - ringR * 1.1);
  } else ringR = wheelD / 2 * 0.8;
}
L = {
vw, vh, dpr, land, cw, cx0, top, bot, m, btnH, fs, titleFs, hh, barH, msgH, sp, paper,
x0: paper.x + 0.5 * sp,
x1: paper.x + paper.w - 0.5 * sp,
bottomY: paper.y + ext.up * sp,
wheel: S.skin === 1 ? { cx: wheelCx, cy: wheelCy, rOut: ringR * 1.22, rIn: ringR * 0.2, ring: ringR }
    : { cx: wheelCx, cy: wheelCy, rOut: wheelD / 2, rIn: wheelD / 2 * 0.33 },
msgX, msgY,
btnW: clamp(cw * 0.26, 86, 130)
};
L.leftLimit = L.x0 + 3.2 * sp;
L.curX      = L.x0 + geo.first * sp;
L.gap       = geo.gap * sp;
}
const stepY = (s, c) => L.bottomY - (s - bottomStep(c)) * L.sp * 0.5;
const noteX = (n) => L.curX + n.slot * L.gap;
let ac = null;
function audio() {
if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
if (ac && ac.state === "suspended") ac.resume();
return ac;
}
function tone(f, dur, type, vol, delay = 0) {
const a = audio();
if (!a || !S.sound || !S.vol) return;
const t = a.currentTime + delay;
const osc = a.createOscillator(), g = a.createGain();
osc.type = type;  osc.frequency.value = f;
const v = Math.max(0.001, (S.vol / 10) * vol);
g.gain.setValueAtTime(0, t);
g.gain.linearRampToValueAtTime(v, t + 0.01);
g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
osc.connect(g);  g.connect(a.destination);
osc.start(t);  osc.stop(t + dur + 0.05);
}
const midi = (step) => 60 + 12 * Math.floor(step / 7) + SEMITONES[mod(step, 7)];
function playNote(step, vol = 0.5) {
const f = 440 * Math.pow(2, (midi(step) - 69) / 12);
tone(f, 1.2, "triangle", vol);
tone(f * 2, 0.6, "sine", vol * 0.25);
}
const playWrong  = () => tone(110, 0.25, "square", 0.18);
const playStreak = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, "triangle", 0.3, i * 0.08));
function buzz(pattern) {
if (S.haptic && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}
let notes = [];
let score = 0, streak = 0, okCount = 0, badCount = 0;
let lastKey = -999, plan = [], generated = 0, bestStreak = 0, results = [];
let curShownAt = 0, curBad = 0, finishAt = 0, pauseStart = null, lastClef = 0;
let scene = "menu", sceneHits = [], scrollY = 0, scrollV = 0, maxScroll = 0, drag = null;
let sum = null, SD = null, sessions = [];
const ST = { clef: -1, period: 0, metric: 0, confirm: 0 };
let flashIdx = -1, flashT = 0, flashOk = true;
let msg = "", msgT = 0, msgOk = true;
function makeNote(prev) {
  const clef = plan[generated++];
  let s, key;
  do { s = rand(lowStep(clef), highStep(clef)); key = clef * 1000 + s; } while (key === lastKey);
  lastKey = key;
  const extra = prev && prev.clef !== clef ? CLEF_GAP : 0;
  const t = prev ? prev.tslot + 1 + extra : 0;
  return { step: s, clef, extra, slot: t, tslot: t, state: 0, shake: 0 };
}
function startSession() {
  const mode = S.mode;
  layout();
  plan = [];
  if (mode === 2) {
    let c = rand(0, 1);
    while (plan.length < SESSION_N) {
      const run = rand(2, 5);
      for (let k = 0; k < run && plan.length < SESSION_N; k++) plan.push(c);
      c = 1 - c;
    }
  } else {
    for (let i = 0; i < SESSION_N; i++) plan.push(mode);
  }
  generated = 0; notes = []; lastKey = -999;
  score = streak = okCount = badCount = bestStreak = 0;
  results = []; msg = ""; msgT = 0; curBad = 0;
  let prev = null;
  for (let i = 0; i < Math.min(PENDING, SESSION_N); i++) { const n = makeNote(prev); notes.push(n); prev = n; }
  lastClef = plan[0];
  curShownAt = performance.now();
  pauseStart = settingsOpen ? curShownAt : null;
  go("game");
}
const restartIfGame = () => { if (scene === "game") startSession(); };
function pauseBegin() { if (pauseStart === null) pauseStart = performance.now(); }
function pauseEnd() {
  if (pauseStart !== null) { curShownAt += performance.now() - pauseStart; pauseStart = null; }
}
let savedScroll = 0;
function setSettings(v) {
  if (v === settingsOpen) return;
  settingsOpen = v;
  if (v) { savedScroll = scrollY; scrollY = 0; scrollV = 0; maxScroll = 0; }
  else { scrollY = savedScroll; scrollV = 0; }
  drag = null;  sceneHits = [];
  if (scene === "game") { if (v) pauseBegin(); else pauseEnd(); }
  dirty = true;
}
function loadSessions() {
  try {
    const a = JSON.parse(localStorage.getItem("mrt_sessions") || "[]");
    sessions = Array.isArray(a) ? a.filter((s) => s && Array.isArray(s.n)) : [];
  } catch (e) { sessions = []; }
}
function saveSessions() {
  if (sessions.length > 400) sessions = sessions.slice(-400);
  try { localStorage.setItem("mrt_sessions", JSON.stringify(sessions)); } catch (e) {}
}
// agrega una lista de [clave, paso, fallos, ms]
function aggOf(list) {
  let n = 0, bad = 0, ms = 0;
  for (const e of list) { n++; bad += e[2]; ms += e[3]; }
  return { n, bad, ms, acc: n ? n / (n + bad) : 0, nps: ms > 0 ? n / (ms / 1000) : 0, avg: n ? ms / n / 1000 : 0 };
}
function reviewList(list) {
  const m = new Map();
  for (const e of list) {
    const k = e[0] + "_" + e[1];
    let a = m.get(k);
    if (!a) { a = { clef: e[0], step: e[1], n: 0, bad: 0, ms: 0 }; m.set(k, a); }
    a.n++; a.bad += e[2]; a.ms += e[3];
  }
  const arr = [...m.values()];
  const wrong = arr.filter((a) => a.bad > 0).sort((a, b) => b.bad - a.bad || b.ms / b.n - a.ms / a.n).slice(0, 3);
  if (wrong.length) return { title: "Notas para repasar", items: wrong, slow: false };
  return { title: "Notas más lentas", items: arr.sort((a, b) => b.ms / b.n - a.ms / a.n).slice(0, 3), slow: true };
}
function finishSession() {
  if (scene !== "game") return;
  const rec = { t: Date.now(), m: S.mode, s: score, r: bestStreak, n: results.slice() };
  let prev = null;
  for (let i = sessions.length - 1; i >= 0; i--) if (sessions[i].m === rec.m) { prev = sessions[i]; break; }
  sessions.push(rec);
  saveSessions();
  sum = {
    rec, all: aggOf(rec.n), prevAgg: prev ? aggOf(prev.n) : null,
    byClef: [aggOf(rec.n.filter((e) => e[0] === 0)), aggOf(rec.n.filter((e) => e[0] === 1))],
    review: reviewList(rec.n)
  };
  playStreak();
  buzz([25, 40, 25]);
  go("summary");
}
const currentNote = () => notes.find((n) => n.state === 0) || null;
const nameOf = (i) => (S.es ? NAMES_ES[i] : NAMES_EN[i]);
function submit(idx) {
  if (scene !== "game" || settingsOpen) return;
  const c = currentNote();
  if (!c) return;
  audio();
  const now = performance.now();
  const ok = mod(c.step, 7) === idx;
  flashIdx = idx;  flashT = 0.35;  flashOk = ok;
  if (ok) {
    c.state = 1;
    streak++;  okCount++;  bestStreak = Math.max(bestStreak, streak);
    if (streak > S.rec) { S.rec = streak; saveSettings(); }
    score += 10 + Math.min(streak, 10);
    results.push([c.clef, c.step, curBad, Math.max(0, Math.round(now - curShownAt))]);
    curShownAt = now;  curBad = 0;
    playNote(c.step);
    buzz(12);
    if (streak % 10 === 0) playStreak();
    const nxt = notes.find((n) => n.state === 0);
    const shift = nxt ? nxt.tslot : 1;
    for (const n of notes) n.tslot -= shift;
    if (generated < SESSION_N) {
      const nn = makeNote(notes[notes.length - 1]);
      nn.slot = nn.tslot + 1.5;
      notes.push(nn);
    }
    if (okCount >= SESSION_N) finishAt = now + 850;
  } else {
    badCount++;  curBad++;  streak = 0;
    c.shake = 1;
    playWrong();
    buzz([35, 45, 35]);
  }
}
function wheelIndex(p) {
const w = L.wheel, vx = p.x - w.cx, vy = p.y - w.cy, d = Math.hypot(vx, vy);
if (d < w.rIn || d > w.rOut) return -1;

const a = mod(Math.atan2(vy, vx) + Math.PI / 2 + seg / 2, Math.PI * 2);
return Math.floor(a / seg) % 7;
}
function act(id) {
  if (id.startsWith("mode_")) { S.mode = clamp(int(id.slice(5), 0), 0, 2); saveSettings(); startSession(); return; }
  if (id.startsWith("tf_")) { ST.clef = int(id.slice(3), -1); computeStats(); dirty = true; return; }
  if (id.startsWith("ln_")) { const p = id.split("_"), n = clamp(int(p[2], 0), 0, 4); if (p[1] === "1") S.lf = n; else S.lg = n; saveSettings(); layout(); dirty = true; return; }
  if (id.startsWith("tp_")) { ST.period = int(id.slice(3), 0); computeStats(); dirty = true; return; }
  switch (id) {
    case "m_play": go("clefs"); return;
    case "m_stats": ST.confirm = 0; computeStats(); go("stats"); return;
    case "back": if (scene === "game" || scene === "summary") go("clefs"); else go("menu"); return;
    case "g_menu": case "s_menu": go("menu"); return;
    case "reset": if (scene === "game") startSession(); return;
    case "s_again": go("clefs"); return;
    case "t_chart": ST.metric = (ST.metric + 1) % 3; dirty = true; return;
    case "t_clear":
      if (ST.confirm > performance.now()) { sessions = []; saveSessions(); ST.confirm = 0; computeStats(); }
      else ST.confirm = performance.now() + 3000;
      dirty = true; return;

    case "close": setSettings(false); break;
    case "vis_-":    S.visible = Math.max(3, S.visible - 1); layout(); break;
    case "vis_+":    S.visible = Math.min(8, S.visible + 1); layout(); break;
    case "skin_0": S.skin = 0; layout(); break;
    case "skin_1": S.skin = 1; layout(); break;
    case "midi_on": S.midi = true; initMidi(); break;
    case "midi_off": S.midi = false; break;
    case "name_es":  S.es = true;  break;
    case "name_en":  S.es = false; break;
    case "sound_on": S.sound = true;  playNote(5, 0.4); break;
    case "sound_off": S.sound = false; break;
    case "vol_-": S.vol = Math.max(0, S.vol - 1);  playNote(5, 0.4); break;
    case "vol_+": S.vol = Math.min(10, S.vol + 1); playNote(5, 0.4); break;

function update(dt) {

let settingsOpen = false;
let buttons = [];
let hoverBtn = "", hoverIdx = -1;
let pointer = { x: -1, y: -1 };
let dirty = true;
const addBtn = (id, x, y, w, h, text, active = false) => buttons.push({ id, x, y, w, h, text, active });
const hit = (b, p) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

const rows = [
{ k: "tap", label: "Nombre de las notas", value: S.es ? "Latín (Do, Re, Mi, …)" : "Anglosajón (C, D, E, …)", id: S.es ? "name_en" : "name_es" },
{ k: "sw", label: "Sonido", value: S.sound ? "Habilitado" : "Deshabilitado", on: S.sound, id: S.sound ? "sound_off" : "sound_on" },
{ k: "step", label: "Volumen", value: S.vol + " / 10", minus: "vol_-", plus: "vol_+" },
{ k: "sw", label: "Vibraciones", value: S.haptic ? "Habilitado" : "Deshabilitado", on: S.haptic, id: S.haptic ? "hap_off" : "hap_on" }

if (navigator.requestMIDIAccess) rows.push({ k: "sw", label: "Teclado MIDI", value: S.midi ? "Habilitado" : "Deshabilitado", on: S.midi, id: S.midi ? "midi_off" : "midi_on" });

const darkUI = () => S.skin === 1 || scene !== "game";
const noteLabel = (step) => nameOf(mod(step, 7)) + (4 + Math.floor(step / 7));
const accCol = (a) => (a >= 0.9 ? AC.ok : a >= 0.7 ? AC.mid : AC.bad);
function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function niceMax(v) {
  const mag = Math.pow(10, Math.floor(Math.log10(v))), n = v / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
function periodCutoff(p) {
  const lim = [7, 30, 1e6][p], d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime() - (lim - 1) * 86400000;
}

/* ---------- estadísticas globales: cálculo ---------- */
function computeStats() {
  const cut = periodCutoff(ST.period), list = sessions.filter((s) => s.t >= cut);
  const clefs = ST.clef < 0 ? [0, 1] : [ST.clef];
  const dm = new Map(), nm = new Map(), all = [];
  let ns = 0;
  for (const s of list) {
    let used = false, day = null;
    for (const e of s.n) {
      if (ST.clef >= 0 && e[0] !== ST.clef) continue;
      if (!day) {
        const k = new Date(s.t).setHours(0, 0, 0, 0);
        day = dm.get(k);
        if (!day) { day = { t: k, arr: [[], []] }; dm.set(k, day); }
      }
      used = true;
      day.arr[e[0]].push(e);  all.push(e);
      const key = e[0] + "_" + e[1];
      let a = nm.get(key);
      if (!a) { a = { clef: e[0], step: e[1], n: 0, bad: 0, ms: 0 }; nm.set(key, a); }
      a.n++;  a.bad += e[2];  a.ms += e[3];
    }
    if (used) ns++;
  }
  const days = [...dm.values()].sort((a, b) => a.t - b.t).map((d) => ({ t: d.t, a: [aggOf(d.arr[0]), aggOf(d.arr[1])] }));
  SD = { clefs, days, all: aggOf(all), notes: [...nm.values()], sessions: ns };
}

/* ---------- utilidades de dibujo ---------- */

  text(str, cx, cy, size, "#d6d6d6", "center", "300", maxW);
  const w = ctx.measureText(str).width;
  ctx.strokeStyle = AC.cyan;  ctx.lineWidth = 3.5;  ctx.lineCap = "round";
  ctx.beginPath();  ctx.moveTo(cx - w * 0.58, cy + size * 0.78);  ctx.lineTo(cx + w * 0.58, cy + size * 0.78);  ctx.stroke();
  ctx.lineCap = "butt";
}
function bigButton(id, x, y, w, h, label) {

function drawBackBtn(id, x, y, size, col) {

function panel(x, y, w, h) {

function statCard(x, y, w, h, label, value, sub, subCol, valCol) {

function seg(x, y, w, h, labels, active, prefix, vals) {
  const n = labels.length, sw = w / n;
  panel(x, y, w, h);
  for (let i = 0; i < n; i++) {

    addHit(id, sx, y, sw, h);
  }
}
function clipRect(x, y, w, h) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); }

function drawFloaters(t) {
  const size = clamp(L.vh * 0.06, 24, 44);
  for (const f of FLOATERS) {
    const fy = L.land ? 0.74 + (f.y - 0.57) * 0.3 : f.y;
    ctx.save();
    ctx.translate(f.x * L.vw, fy * L.vh + Math.sin(t * 0.0012 + f.p) * 5);
    ctx.rotate(f.r + Math.sin(t * 0.0009 + f.p) * 0.06);
    glyph(f.g, 0, 0, FCOL[f.c], size * f.s);
    ctx.restore();

function drawPianoBand(t) {
  const keyW = Math.min(clamp(L.vw / 13, 24, 44), L.vh * 0.075 + 12), keyH = Math.min(keyW * 2.7, L.vh * 0.2);
  const amp = clamp(L.vh * 0.035, 10, 32);
  const base = L.bot - keyH - amp - clamp(L.vh * 0.03, 10, 24);
  const k = (Math.PI * 2) / (L.vw * 0.95), ph = t * 0.00035, N = Math.ceil(L.vw / keyW) + 3, pos = [];
  for (let i = -1; i < N; i++) {
    const x = i * keyW, a = x * k + ph;
    pos.push({ x, y: base + amp * Math.sin(a), ang: Math.atan(amp * k * Math.cos(a)), i });
  }
  for (const p of pos) {
    ctx.save();  ctx.translate(p.x, p.y);  ctx.rotate(p.ang);
    ctx.fillStyle = "#efefef";  rr(1, 0, keyW - 1.5, keyH, 3);  ctx.fill();
    ctx.restore();
  }
  for (const p of pos) {
    const m7 = mod(p.i, 7);
    if (m7 === 2 || m7 === 6) continue;
    ctx.save();  ctx.translate(p.x, p.y);  ctx.rotate(p.ang);
    ctx.fillStyle = "#1c1c1c";  rr(keyW - keyW * 0.3, 0, keyW * 0.6, keyH * 0.62, 2);  ctx.fill();
    ctx.restore();
  }
}

/* ---------- elección de clave ---------- */
function clefCard(id, mode, x, y, w, h) {
  const hov = hoverBtn === id, sel = S.mode === mode;
  ctx.fillStyle = hov ? "rgba(46,211,230,.12)" : AC.card;  rr(x, y, w, h, 12);  ctx.fill();
  ctx.strokeStyle = hov || sel ? AC.cyan : AC.edge;  ctx.lineWidth = sel ? 2 : 1.2;  ctx.stroke();
  const s = h * 0.1, cy = y + h / 2, ix = x + h * 0.15, iw = h * 0.72;
  for (let i = 0; i < 5; i++) line(ix, cy + (i - 2) * s, ix + iw, cy + (i - 2) * s, "#6b6b6b", 1);
  const col = "#e6e6e6";
  if (mode === 0) glyph(G_CLEF, ix + s * 0.4, cy + s, col, 4 * s);
  else if (mode === 1) glyph(F_CLEF, ix + s * 0.4, cy - s, col, 4 * s);
  else { glyph(G_CLEF, ix + s * 0.1, cy + s, col, 4 * s);  glyph(F_CLEF, ix + iw * 0.52, cy - s, col, 4 * s); }
  const tx = ix + iw + h * 0.13, rEdge = x + w - 38;
  const hasSel = mode < 2;
  let lblLeft = rEdge;
  if (hasSel) {
    // selector de líneas adicionales (0-4), propio de cada clave
    const val = mode === 1 ? S.lf : S.lg;
    const bs = clamp(h * 0.19, 16, 22), pitch = bs + 4, boxesW = 5 * pitch - 4, bx0 = rEdge - boxesW;
    const lblSz = clamp(h * 0.11, 9.5, 12), lbl = "Líneas adicionales";
    ctx.font = lblSz + "px system-ui,sans-serif";
    lblLeft = rEdge - ctx.measureText(lbl).width;
    text(lbl, rEdge, y + h * 0.58, lblSz, AC.dim, "right");
    for (let n = 0; n <= 4; n++) {
      const bx = bx0 + n * pitch, by = y + h * 0.8 - bs / 2, on = val === n;
      ctx.fillStyle = on ? "rgba(46,211,230,.2)" : "#3b3b3b";  rr(bx, by, bs, bs, 3);  ctx.fill();
      if (on) { ctx.strokeStyle = AC.cyan;  ctx.lineWidth = 1.2;  ctx.stroke(); }
      text(String(n), bx + bs / 2, by + bs / 2, bs * 0.62, on ? AC.cyan : "#9a9a9a", "center", on ? "bold" : "");
      addHit("ln_" + mode + "_" + n, bx - 2, by - 6, pitch, bs + 12);   // antes que la tarjeta: tiene prioridad
    }
  }
  text(MODE_NAME[mode], tx, y + h * 0.32, clamp(h * 0.21, 15, 22), AC.txt, "left", "", x + w - tx - 36);
  text(["Registro agudo", "Registro grave", "Intercaladas al azar"][mode], tx, y + h * 0.58, clamp(h * 0.15, 11, 14), AC.dim, "left", "", Math.max(40, lblLeft - 8 - tx));
  ctx.strokeStyle = sel || hov ? AC.cyan : "#777";  ctx.lineWidth = 2;  ctx.lineCap = "round";
  ctx.beginPath();  ctx.moveTo(x + w - 26, cy - 8);  ctx.lineTo(x + w - 18, cy);  ctx.lineTo(x + w - 26, cy + 8);  ctx.stroke();
  ctx.lineCap = "butt";
  addHit(id, x, y, w, h);
}
function drawClefs() {
  const cx = L.cx0 + L.cw / 2, h = L.vh;
  drawBar("Elige la clave", { back: "back", actions: [{ id: "open", icon: "gear" }] });
  const topY = L.top + L.barH + L.m * 2, avail = L.bot - L.m - topY;
  const ch = clamp(Math.min(h * 0.14, avail / 3.4), 52, 108), gap = ch * 0.16;
  const cw = Math.min(L.cw - L.m * 4, 520), x = cx - cw / 2;
  let y = topY;
  for (let m = 0; m < 3; m++) { clefCard("mode_" + m, m, x, y, cw, ch);  y += ch + gap; }
}

/* ---------- resumen de sesión ---------- */
function delta(cur, prev, higher, dec, unit) {
  if (prev === null || prev === undefined) return null;
  const d = cur - prev;
  if (Math.abs(d) < Math.pow(10, -dec) / 2) return { t: "= igual que la anterior", c: AC.dim };
  return { t: (d > 0 ? "▲ " : "▼ ") + Math.abs(d).toFixed(dec) + unit + " vs anterior", c: (higher ? d > 0 : d < 0) ? AC.ok : AC.bad };
}
function drawSummary() {
  drawBar("Sesión completada", { back: "back", actions: [{ id: "open", icon: "gear" }] });
  const w = Math.min(L.cw - L.m * 2, 560), x = L.cx0 + (L.cw - w) / 2, cx = x + w / 2;
  const pad = clamp(w * 0.05, 14, 22), fs = clamp(w * 0.034, 12, 15);
  const btnH = clamp(L.vh * 0.07, 46, 58), barH = btnH + L.m * 2, viewBot = L.bot - barH;
  const bw = (w - 12) / 2, by = L.bot - L.m - btnH;
  addHit("s_again", x, by, bw, btnH);
  addHit("s_menu", x + bw + 12, by, bw, btnH);
  const r = sum.rec, A = sum.all, P = sum.prevAgg;
  clipRect(0, L.top + L.barH, L.vw, viewBot - L.top - L.barH);
  let y = L.top + L.barH + pad - scrollY;
  y += 6;
  text(MODE_NAME[r.m] + " · " + SESSION_N + " notas", cx, y, fs, AC.dim, "center");
  y += fs * 1.2 + pad;
  // anillo de precisión
  const R = clamp(w * 0.19, 54, 88), lw = R * 0.2, ry = y + R + lw / 2;
  ctx.lineWidth = lw;  ctx.strokeStyle = "#333";
  ctx.beginPath();  ctx.arc(cx, ry, R, 0, Math.PI * 2);  ctx.stroke();
  ctx.strokeStyle = accCol(A.acc);  ctx.lineCap = "round";
  ctx.beginPath();  ctx.arc(cx, ry, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * A.acc);  ctx.stroke();
  ctx.lineCap = "butt";
  text(Math.round(A.acc * 100) + "%", cx, ry - R * 0.08, R * 0.5, AC.txt, "center", "bold", R * 1.5);
  text("precisión", cx, ry + R * 0.44, clamp(R * 0.2, 11, 15), AC.dim, "center");
  y = ry + R + lw / 2 + pad * 0.8;
  if (P) {
    const d = Math.round((A.acc - P.acc) * 100);
    const t = d === 0 ? "= igual que la sesión anterior" : (d > 0 ? "▲ +" : "▼ ") + d + " pts vs. sesión anterior";
    text(t, cx, y, fs, d === 0 ? AC.dim : d > 0 ? AC.ok : AC.bad, "center");
  } else text("Primera sesión de esta modalidad", cx, y, fs, AC.dim, "center");
  y += fs * 1.2 + pad;
  // tarjetas
  const gap = 10, cw = (w - gap) / 2, ch = clamp(w * 0.2, 66, 84);
  const dN = P ? delta(A.nps, P.nps, true, 2, "") : null, dA = P ? delta(A.avg, P.avg, false, 1, " s") : null;
  const cards = [
    ["Tiempo total", fmtTime(A.ms), A.n + " notas", AC.dim],
    ["Notas por segundo", A.nps.toFixed(2), dN ? dN.t : "", dN ? dN.c : AC.dim],
    ["Tiempo por nota", A.avg.toFixed(1) + " s", dA ? dA.t : "", dA ? dA.c : AC.dim],
    ["Fallos", String(A.bad), A.bad === 0 ? "¡Sin fallos!" : "", AC.ok],
    ["Mejor racha", String(r.r), "aciertos seguidos", AC.dim],
    ["Puntos", String(r.s), "", AC.dim]
  ];
  cards.forEach((c, i) => statCard(x + (i % 2) * (cw + gap), y + Math.floor(i / 2) * (ch + gap), cw, ch, c[0], c[1], c[2], c[3]));
  y += 3 * ch + 2 * gap + pad;
  // por clave
  if (r.m === 2) {
    const rh = clamp(w * 0.1, 38, 48), ph = 34 + rh * 2;
    text("POR CLAVE", x + 2, y + 4, 12, AC.dim, "left", "bold");
    y += 16;
    panel(x, y, w, rh * 2 + 10);
    for (let c = 0; c < 2; c++) {
      const B = sum.byClef[c], ry2 = y + 5 + rh * c + rh / 2;
      ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(x + 20, ry2, 5, 0, Math.PI * 2);  ctx.fill();
      text(MODE_NAME[c], x + 36, ry2, fs + 1, AC.txt, "left", "", w * 0.4);
      text(Math.round(B.acc * 100) + "% · " + B.avg.toFixed(1) + " s/nota", x + w - 14, ry2, fs, accCol(B.acc), "right", "", w * 0.5);
    }
    y += rh * 2 + 10 + pad;
  }
  // repaso
  const rv = sum.review;
  text(rv.title.toUpperCase(), x + 2, y + 4, 12, AC.dim, "left", "bold");
  y += 16;
  const rrh = clamp(w * 0.09, 36, 44);
  panel(x, y, w, rrh * Math.max(1, rv.items.length) + 10);
  rv.items.forEach((a, i) => {
    const ry2 = y + 5 + rrh * i + rrh / 2;
    ctx.fillStyle = clefCol(a.clef);  ctx.beginPath();  ctx.arc(x + 20, ry2, 5, 0, Math.PI * 2);  ctx.fill();
    text(noteLabel(a.step), x + 36, ry2, fs + 2, AC.txt, "left", "bold");
    const info = (a.bad > 0 ? a.bad + (a.bad === 1 ? " fallo" : " fallos") + " · " : "") + (a.ms / a.n / 1000).toFixed(1) + " s";
    text(info, x + w - 14, ry2, fs, a.bad > 0 ? AC.bad : AC.dim, "right", "", w * 0.55);
  });
  y += rrh * Math.max(1, rv.items.length) + 10 + pad;
  maxScroll = Math.max(0, y + scrollY - viewBot);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
  // barra inferior fija
  ctx.fillStyle = AC.bg;  ctx.fillRect(0, viewBot, L.vw, L.vh - viewBot);
  line(0, viewBot, L.vw, viewBot, "#333", 1);
  actionBtn(x, by, bw, btnH, "Nueva sesión", true, hoverBtn === "s_again");
  actionBtn(x + bw + 12, by, bw, btnH, "Menú principal", false, hoverBtn === "s_menu");
}

/* ---------- estadísticas globales: dibujo ---------- */
function drawChart(x, y, w, h) {
  panel(x, y, w, h);
  addHit("t_chart", x, y, w, h);
  const lm = 46, rm = 16, tm = 16, bm = 28, px = x + lm, py = y + tm, pw = w - lm - rm, ph = h - tm - bm;
  const m = ST.metric, days = SD.days, per = ST.period, cut = periodCutoff(per);
  const nX = per < 2 ? (per === 0 ? 7 : 30) : Math.max(days.length, 1);
  const val = (a) => (m === 0 ? a.acc * 100 : m === 1 ? a.nps : a.n);
  const series = SD.clefs.map((c) => ({
    c,
    pts: days.map((d, i) => (d.a[c].n ? { i: per < 2 ? Math.round((d.t - cut) / 86400000) : i, v: val(d.a[c]) } : null)).filter(Boolean)
  }));
  let mx = 0;
  for (const s of series) for (const p of s.pts) mx = Math.max(mx, p.v);
  const ymax = m === 0 ? 100 : niceMax(Math.max(0.1, mx * 1.1));
  const fy = (v) => (m === 0 ? Math.round(v) + "%" : String(Math.round(v * 100) / 100));
  const fsz = 11;
  for (let g = 0; g <= 4; g++) {
    const gy = py + ph - (g / 4) * ph;
    line(px, gy, px + pw, gy, "#383838", 1);
    text(fy((ymax * g) / 4), px - 8, gy, fsz, AC.dim, "right");
  }
  const xp = (i) => px + ((i + 0.5) / nX) * pw;
  const maxLab = Math.max(1, Math.floor(pw / 44)), stepL = Math.ceil(nX / maxLab);
  for (let i = 0; i < nX; i += stepL) {
    let dd;
    if (per < 2) { dd = new Date(cut);  dd.setDate(dd.getDate() + i); }
    else dd = new Date(days[i] ? days[i].t : cut);
    text(dd.getDate() + "/" + (dd.getMonth() + 1), xp(i), py + ph + 15, fsz, AC.dim, "center");
  }
  for (const s of series) {
    const col = clefCol(s.c);
    if (s.pts.length > 1) {
      ctx.strokeStyle = col;  ctx.lineWidth = 2.6;  ctx.lineJoin = "round";
      ctx.beginPath();
      s.pts.forEach((p, k) => { const X = xp(p.i), Y = py + ph - (p.v / ymax) * ph; if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.stroke();
    }
    ctx.fillStyle = col;
    for (const p of s.pts) { ctx.beginPath();  ctx.arc(xp(p.i), py + ph - (p.v / ymax) * ph, 4.2, 0, Math.PI * 2);  ctx.fill(); }
  }
}
function drawStats() {
  const w = Math.min(L.cw - L.m * 2, 640), x = L.cx0 + (L.cw - w) / 2, pad = clamp(w * 0.045, 12, 22), fs = clamp(w * 0.036, 12, 16);
  const hdrH = L.top + L.barH;
  const conf = ST.confirm > performance.now();
  drawBar("Estadísticas", { back: "back", actions: [{ id: "t_clear", label: conf ? "¿Seguro?" : "Borrar", warn: conf }, { id: "open", icon: "gear" }] });
  clipRect(0, hdrH, L.vw, L.vh - hdrH);
  let y = hdrH + pad - scrollY;
  const segH = clamp(w * 0.1, 38, 46), lblW = w * 0.2;
  text("Clave", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, ["Todas", "Sol", "Fa"], ST.clef + 1, "tf_", [-1, 0, 1]);
  y += segH + 10;
  text("Periodo", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, ["7 días", "30 días", "Todo"], ST.period, "tp_", [0, 1, 2]);
  y += segH + pad;
  const A = SD.all;
  if (!A.n) {
    const eh = clamp(w * 0.5, 150, 220);
    panel(x, y, w, eh);
    text("Aún no hay datos", x + w / 2, y + eh * 0.38, clamp(w * 0.055, 18, 24), AC.txt, "center", "", w - 20);
    text("Completa una sesión para ver aquí tu progreso", x + w / 2, y + eh * 0.58, fs, AC.dim, "center", "", w - 20);
    y += eh + pad;
  } else {
    // tarjetas
    const gap = 10, cw = (w - gap) / 2, ch = clamp(w * 0.19, 62, 80);
    const cards = [
      ["Sesiones", String(SD.sessions), AC.txt],
      ["Notas leídas", String(A.n), AC.txt],
      ["Precisión", Math.round(A.acc * 100) + "%", accCol(A.acc)],
      ["Notas por segundo", A.nps.toFixed(2), AC.txt],
      ["Tiempo por nota", A.avg.toFixed(1) + " s", AC.txt],
      ["Tiempo jugado", fmtTime(A.ms), AC.txt]
    ];
    cards.forEach((c, i) => statCard(x + (i % 2) * (cw + gap), y + Math.floor(i / 2) * (ch + gap), cw, ch, c[0], c[1], "", AC.dim, c[2]));
    y += 3 * ch + 2 * gap + pad * 1.4;
    // gráfico
    const names = ["PRECISIÓN", "NOTAS POR SEGUNDO", "NOTAS PRACTICADAS"];
    text(names[ST.metric], x + w / 2, y, clamp(fs, 12, 15), AC.txt, "center", "bold");
    y += fs * 1.2;
    text("Pulsa en el gráfico para alternar entre estadísticas", x + w / 2, y, clamp(fs * 0.85, 11, 13), AC.dim, "center", "", w);
    y += fs * 1.1;
    const gh = clamp(w * 0.62, 200, 300);
    drawChart(x, y, w, gh);
    y += gh + 12;
    if (ST.clef < 0) {
      const lx = x + w / 2 - 110;
      [0, 1].forEach((c, i) => {
        ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(lx + i * 120 + 6, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
        text(MODE_NAME[c], lx + i * 120 + 18, y + 8, 12, AC.dim, "left");
      });
      y += 24;
    }
    y += pad;
    // notas
    const rh = clamp(w * 0.085, 38, 46);
    for (const c of SD.clefs) {
      const arr = SD.notes.filter((n) => n.clef === c).sort((a, b) => a.step - b.step);
      if (!arr.length) continue;
      ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(x + 8, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
      text(MODE_NAME[c].toUpperCase(), x + 20, y + 8, 12, AC.dim, "left", "bold");
      y += 24;
      text("Nota", x + 14, y + 6, 11, AC.dim, "left");
      text("Veces", x + w * 0.42, y + 6, 11, AC.dim, "right");
      text("Tiempo", x + w * 0.7, y + 6, 11, AC.dim, "right");
      text("Acierto", x + w - 14, y + 6, 11, AC.dim, "right");
      y += 18;
      panel(x, y, w, rh * arr.length);
      arr.forEach((a, i) => {
        const ry = y + rh * i + rh / 2, acc = a.n / (a.n + a.bad);
        if (i) line(x + 12, y + rh * i, x + w - 12, y + rh * i, "#353535", 1);
        text(noteLabel(a.step), x + 14, ry, fs + 2, AC.txt, "left", "bold");
        text(String(a.n), x + w * 0.42, ry, fs, AC.dim, "right");
        text((a.ms / a.n / 1000).toFixed(1) + " s", x + w * 0.7, ry, fs, AC.dim, "right");
        text(Math.round(acc * 100) + "%", x + w - 14, ry, fs + 2, accCol(acc), "right", "bold");
      });
      y += rh * arr.length + pad * 1.2;
    }
  }
  maxScroll = Math.max(0, y + scrollY - L.vh);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
}

function draw(t) {
ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
sceneHits = [];
if (settingsOpen) { drawSettings(); return; }
if (scene === "game") {
ctx.fillStyle = S.skin === 1 ? "#212121" : C.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
drawBar(MODE_NAME[S.mode], { back: "back", actions: [{ id: "reset", icon: "reset" }, { id: "open", icon: "gear" }] });
if (S.skin === 1) drawHeaderDark(); else { drawHeader(); drawPaper(); }
drawStaff();
drawNotes();
drawMessage();
drawWheel();
} else {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
if (scene === "menu") drawMenu(t);
else if (scene === "clefs") drawClefs();
else if (scene === "summary") drawSummary();
else if (scene === "stats") drawStats();
}
}
let last = performance.now();
function frame(t) {
const dt = Math.min(0.05, (t - last) / 1000);
last = t;
const moving = update(dt);
if (finishAt && performance.now() >= finishAt) { finishAt = 0; finishSession(); }
buildUI();
const hi = settingsOpen || scene !== "game" ? -1 : wheelIndex(pointer);
let hb = "";
for (const b of buttons) if (hit(b, pointer)) { hb = b.id; break; }
if (hi !== hoverIdx || hb !== hoverBtn) { hoverIdx = hi; hoverBtn = hb; dirty = true; }
if (moving || dirty) { draw(t); dirty = false; }
requestAnimationFrame(frame);
}
function onResize() { layout(); dirty = true; }
addEventListener("resize", onResize);
addEventListener("orientationchange", () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
document.addEventListener("fullscreenchange", onResize);
document.addEventListener("webkitfullscreenchange", onResize);
function start() {
loadSettings();
loadSessions();
layout();
if (S.midi) initMidi();
requestAnimationFrame(frame);
}
addEventListener("load", () => {
if (document.fonts && document.fonts.load) {
document.fonts.load("40px Bravura", "\uE050\uE062\uE1D5\uE1D6").then(start, start);
} else start();
});
</script>
