/* ===================== PANTALLAS NUEVAS ===================== */
function addHit(id, x, y, w, h) { sceneHits.push({ id, x, y, w, h, hidden: true, text: "", active: false }); }
function go(s) {
  const d0 = depth(), changed = s !== scene;
  if (changed) startTrans(-1);
  scene = s;  sceneHits = [];  scrollY = 0;  scrollV = 0;  maxScroll = 0;  drag = null;  finishAt = 0;
  if (changed && trans) trans.dir = depth() >= d0 ? 1 : -1;
  dirty = true;
  if (s === "clefs") { lnOpen = [false, false];  lnT = [0, 0];  pianoPreload(pianoSteps(S.mode)); }
  syncHist();  wakeSync();
}
const darkUI = () => S.skin === 1 || scene !== "game";
const noteLabel = (step) => nameOf(mod(step, 7)) + (4 + Math.floor(step / 7));
const accCol = (a) => (a >= 0.9 ? AC.ok : a >= 0.7 ? AC.mid : AC.bad);
function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function niceMax(v) {
  const mag = Math.pow(10, Math.floor(Math.log10(v))), n = v / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
function periodCutoff(p) {
  const lim = [7, 30, 1e6][p], d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime() - (lim - 1) * 86400000;
}

/* ---------- estadísticas globales: cálculo ---------- */
function computeStats() {
  const cut = periodCutoff(ST.period), list = sessions.filter((s) => s.t >= cut);
  const clefs = ST.clef < 0 ? [0, 1] : [ST.clef];
  const dm = new Map(), nm = new Map(), all = [];
  let ns = 0;
  for (const s of list) {
    let used = false, day = null;
    for (const e of s.n) {
      if (ST.clef >= 0 && e[0] !== ST.clef) continue;
      if (!day) {
        const k = new Date(s.t).setHours(0, 0, 0, 0);
        day = dm.get(k);
        if (!day) { day = { t: k, arr: [[], []] }; dm.set(k, day); }
      }
      used = true;
      day.arr[e[0]].push(e);  all.push(e);
      const key = e[0] + "_" + e[1];
      let a = nm.get(key);
      if (!a) { a = { clef: e[0], step: e[1], n: 0, bad: 0, ms: 0 }; nm.set(key, a); }
      a.n++;  a.bad += e[2];  a.ms += e[3];
    }
    if (used) ns++;
  }
  const days = [...dm.values()].sort((a, b) => a.t - b.t).map((d) => ({ t: d.t, a: [aggOf(d.arr[0]), aggOf(d.arr[1])] }));
  SD = { clefs, days, all: aggOf(all), notes: [...nm.values()], sessions: ns, rvN: reviewInfo(clefs).nWeak };
}

let lnOpen = [false, false], lnT = [0, 0];

  ctx.beginPath();  ctx.arc(cx, ry, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * A.acc);  ctx.stroke();
  ctx.lineCap = "butt";
  text(Math.round(A.acc * 100) + "%", cx, ry - R * 0.08, R * 0.5, AC.txt, "center", "bold", R * 1.5);
  text("precisión", cx, ry + R * 0.44, clamp(R * 0.2, 11, 15), AC.dim, "center");
  y = ry + R + lw / 2 + pad * 0.8;
  if (P) {
    const d = Math.round((A.acc - P.acc) * 100);
    const t = d === 0 ? "= igual que la sesión anterior" : (d > 0 ? "▲ +" : "▼ ") + d + " pts vs. sesión anterior";
    text(t, cx, y, fs, d === 0 ? AC.dim : d > 0 ? AC.ok : AC.bad, "center");
  } else text("Primera sesión de esta modalidad", cx, y, fs, AC.dim, "center");
  y += fs * 1.2 + pad;
  // tarjetas
  const gap = 10, cw = (w - gap) / 2, ch = clamp(w * 0.2, 66, 84);
  const dN = P ? delta(A.nps, P.nps, true, 2, "") : null, dA = P ? delta(A.avg, P.avg, false, 1, " s") : null;
  const cards = [
    ["Tiempo total", fmtTime(A.ms), A.n + " notas", AC.dim],
    ["Notas por segundo", A.nps.toFixed(2), dN ? dN.t : "", dN ? dN.c : AC.dim],
    ["Tiempo por nota", A.avg.toFixed(1) + " s", dA ? dA.t : "", dA ? dA.c : AC.dim],
    ["Fallos", String(A.bad), A.bad === 0 ? "¡Sin fallos!" : "", AC.ok],
    ["Mejor racha", String(r.r), "aciertos seguidos", AC.dim],
    ["Puntos", String(r.s), "", AC.dim]
  ];
  cards.forEach((c, i) => statCard(x + (i % 2) * (cw + gap), y + Math.floor(i / 2) * (ch + gap), cw, ch, c[0], c[1], c[2], c[3]));
  y += 3 * ch + 2 * gap + pad;
  // por clave
  if (r.m === 2) {
    const rh = clamp(w * 0.1, 38, 48), ph = 34 + rh * 2;
    text("POR CLAVE", x + 2, y + 4, 12, AC.dim, "left", "bold");
    y += 16;
    panel(x, y, w, rh * 2 + 10);
    for (let c = 0; c < 2; c++) {
      const B = sum.byClef[c], ry2 = y + 5 + rh * c + rh / 2;
      ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(x + 20, ry2, 5, 0, Math.PI * 2);  ctx.fill();
      text(MODE_NAME[c], x + 36, ry2, fs + 1, AC.txt, "left", "", w * 0.4);
      text(Math.round(B.acc * 100) + "% · " + B.avg.toFixed(1) + " s/nota", x + w - 14, ry2, fs, accCol(B.acc), "right", "", w * 0.5);
    }
    y += rh * 2 + 10 + pad;
  }
  // repaso
  const rv = sum.review;
  text(rv.title.toUpperCase(), x + 2, y + 4, 12, AC.dim, "left", "bold");
  y += 16;
  const rrh = clamp(w * 0.09, 36, 44);
  panel(x, y, w, rrh * Math.max(1, rv.items.length) + 10);
  rv.items.forEach((a, i) => {
    const ry2 = y + 5 + rrh * i + rrh / 2;
    ctx.fillStyle = clefCol(a.clef);  ctx.beginPath();  ctx.arc(x + 20, ry2, 5, 0, Math.PI * 2);  ctx.fill();
    text(noteLabel(a.step), x + 36, ry2, fs + 2, AC.txt, "left", "bold");
    const info = (a.bad > 0 ? a.bad + (a.bad === 1 ? " fallo" : " fallos") + " · " : "") + (a.ms / a.n / 1000).toFixed(1) + " s";
    text(info, x + w - 14, ry2, fs, a.bad > 0 ? AC.bad : AC.dim, "right", "", w * 0.55);
  });
  y += rrh * Math.max(1, rv.items.length) + 10 + pad;
  if (sum.rvN > 0) {
    const rbh = clamp(L.vh * 0.065, 44, 54);
    actionBtn(x, y, w, rbh, "Repasar mis fallos", false, hoverBtn === "s_review");
    addHit("s_review", x, y, w, rbh);
    y += rbh + pad;
  }
  maxScroll = Math.max(0, y + scrollY - viewBot);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
  // barra inferior fija
  ctx.fillStyle = AC.bg;  ctx.fillRect(0, viewBot, L.vw, L.vh - viewBot);
  line(0, viewBot, L.vw, viewBot, "#333", 1);
  actionBtn(x, by, bw, btnH, "Nueva sesión", true, hoverBtn === "s_again");
  actionBtn(x + bw + 12, by, bw, btnH, "Menú principal", false, hoverBtn === "s_menu");
}

/* ---------- estadísticas globales: dibujo ---------- */
function drawChart(x, y, w, h) {
  panel(x, y, w, h);
  addHit("t_chart", x, y, w, h);
  const lm = 46, rm = 16, tm = 16, bm = 28, px = x + lm, py = y + tm, pw = w - lm - rm, ph = h - tm - bm;
  const m = ST.metric, days = SD.days, per = ST.period, cut = periodCutoff(per);
  const nX = per < 2 ? (per === 0 ? 7 : 30) : Math.max(days.length, 1);
  const val = (a) => (m === 0 ? a.acc * 100 : m === 1 ? a.nps : a.n);
  const series = SD.clefs.map((c) => ({
    c,
    pts: days.map((d, i) => (d.a[c].n ? { i: per < 2 ? Math.round((d.t - cut) / 86400000) : i, v: val(d.a[c]) } : null)).filter(Boolean)
  }));
  let mx = 0;
  for (const s of series) for (const p of s.pts) mx = Math.max(mx, p.v);
  const ymax = m === 0 ? 100 : niceMax(Math.max(0.1, mx * 1.1));
  const fy = (v) => (m === 0 ? Math.round(v) + "%" : String(Math.round(v * 100) / 100));
  const fsz = 11;
  for (let g = 0; g <= 4; g++) {
    const gy = py + ph - (g / 4) * ph;
    line(px, gy, px + pw, gy, "#383838", 1);
    text(fy((ymax * g) / 4), px - 8, gy, fsz, AC.dim, "right");
  }
  const xp = (i) => px + ((i + 0.5) / nX) * pw;
  const maxLab = Math.max(1, Math.floor(pw / 44)), stepL = Math.ceil(nX / maxLab);
  for (let i = 0; i < nX; i += stepL) {
    let dd;
    if (per < 2) { dd = new Date(cut);  dd.setDate(dd.getDate() + i); }
    else dd = new Date(days[i] ? days[i].t : cut);
    text(dd.getDate() + "/" + (dd.getMonth() + 1), xp(i), py + ph + 15, fsz, AC.dim, "center");
  }
  for (const s of series) {
    const col = clefCol(s.c);
    if (s.pts.length > 1) {
      ctx.strokeStyle = col;  ctx.lineWidth = 2.6;  ctx.lineJoin = "round";
      ctx.beginPath();
      s.pts.forEach((p, k) => { const X = xp(p.i), Y = py + ph - (p.v / ymax) * ph; if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.stroke();
    }
    ctx.fillStyle = col;
    for (const p of s.pts) { ctx.beginPath();  ctx.arc(xp(p.i), py + ph - (p.v / ymax) * ph, 4.2, 0, Math.PI * 2);  ctx.fill(); }
  }
}
function drawStats() {
  const w = Math.min(L.cw - L.m * 2, 640), x = L.cx0 + (L.cw - w) / 2, pad = clamp(w * 0.045, 12, 22), fs = clamp(w * 0.036, 12, 16);
  const hdrH = L.top + L.barH;
  const conf = ST.confirm > performance.now();
  drawBar("Estadísticas", { back: "back", actions: [{ id: "t_clear", label: conf ? "¿Seguro?" : "Borrar", warn: conf }, { id: "open", icon: "gear" }] });
  clipRect(0, hdrH, L.vw, L.vh - hdrH);
  let y = hdrH + pad - scrollY;
  const segH = clamp(w * 0.1, 38, 46), lblW = w * 0.2;
  text("Clave", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, ["Todas", "Sol", "Fa"], ST.clef + 1, "tf_", [-1, 0, 1]);
  y += segH + 10;
  text("Periodo", x + 2, y + segH / 2, fs, AC.dim, "left");
  seg(x + lblW, y, w - lblW, segH, ["7 días", "30 días", "Todo"], ST.period, "tp_", [0, 1, 2]);
  y += segH + pad;
  const A = SD.all;
  if (!A.n) {
    const eh = clamp(w * 0.5, 150, 220);
    panel(x, y, w, eh);
    text("Aún no hay datos", x + w / 2, y + eh * 0.38, clamp(w * 0.055, 18, 24), AC.txt, "center", "", w - 20);
    text("Completa una sesión para ver aquí tu progreso", x + w / 2, y + eh * 0.58, fs, AC.dim, "center", "", w - 20);
    y += eh + pad;
  } else {
    // tarjetas
    const gap = 10, cw = (w - gap) / 2, ch = clamp(w * 0.19, 62, 80);
    const cards = [
      ["Sesiones", String(SD.sessions), AC.txt],
      ["Notas leídas", String(A.n), AC.txt],
      ["Precisión", Math.round(A.acc * 100) + "%", accCol(A.acc)],
      ["Notas por segundo", A.nps.toFixed(2), AC.txt],
      ["Tiempo por nota", A.avg.toFixed(1) + " s", AC.txt],
      ["Tiempo jugado", fmtTime(A.ms), AC.txt]
    ];
    cards.forEach((c, i) => statCard(x + (i % 2) * (cw + gap), y + Math.floor(i / 2) * (ch + gap), cw, ch, c[0], c[1], "", AC.dim, c[2]));
    y += 3 * ch + 2 * gap + pad * 1.4;
    if (SD.rvN > 0) {
      const rbh = clamp(w * 0.12, 44, 54);
      actionBtn(x, y, w, rbh, "Repasar mis fallos · " + SD.rvN + (SD.rvN === 1 ? " nota" : " notas"), true, hoverBtn === "t_review");
      addHit("t_review", x, y, w, rbh);
      y += rbh + pad * 1.4;
    }
    // gráfico
    const names = ["PRECISIÓN", "NOTAS POR SEGUNDO", "NOTAS PRACTICADAS"];
    text(names[ST.metric], x + w / 2, y, clamp(fs, 12, 15), AC.txt, "center", "bold");
    y += fs * 1.2;
    text("Pulsa en el gráfico para alternar entre estadísticas", x + w / 2, y, clamp(fs * 0.85, 11, 13), AC.dim, "center", "", w);
    y += fs * 1.1;
    const gh = clamp(w * 0.62, 200, 300);
    drawChart(x, y, w, gh);
    y += gh + 12;
    if (ST.clef < 0) {
      const lx = x + w / 2 - 110;
      [0, 1].forEach((c, i) => {
        ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(lx + i * 120 + 6, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
        text(MODE_NAME[c], lx + i * 120 + 18, y + 8, 12, AC.dim, "left");
      });
      y += 24;
    }
    y += pad;
    // notas
    const rh = clamp(w * 0.085, 38, 46);
    for (const c of SD.clefs) {
      const arr = SD.notes.filter((n) => n.clef === c).sort((a, b) => a.step - b.step);
      if (!arr.length) continue;
      ctx.fillStyle = clefCol(c);  ctx.beginPath();  ctx.arc(x + 8, y + 8, 5, 0, Math.PI * 2);  ctx.fill();
      text(MODE_NAME[c].toUpperCase(), x + 20, y + 8, 12, AC.dim, "left", "bold");
      y += 24;
      text("Nota", x + 14, y + 6, 11, AC.dim, "left");
      text("Veces", x + w * 0.42, y + 6, 11, AC.dim, "right");
      text("Tiempo", x + w * 0.7, y + 6, 11, AC.dim, "right");
      text("Acierto", x + w - 14, y + 6, 11, AC.dim, "right");
      y += 18;
      panel(x, y, w, rh * arr.length);
      arr.forEach((a, i) => {
        const ry = y + rh * i + rh / 2, acc = a.n / (a.n + a.bad);
        if (i) line(x + 12, y + rh * i, x + w - 12, y + rh * i, "#353535", 1);
        text(noteLabel(a.step), x + 14, ry, fs + 2, AC.txt, "left", "bold");
        text(String(a.n), x + w * 0.42, ry, fs, AC.dim, "right");
        text((a.ms / a.n / 1000).toFixed(1) + " s", x + w * 0.7, ry, fs, AC.dim, "right");
        text(Math.round(acc * 100) + "%", x + w - 14, ry, fs + 2, accCol(acc), "right", "bold");
      });
      y += rh * arr.length + pad * 1.2;
    }
  }
  maxScroll = Math.max(0, y + scrollY - L.vh);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
}

function draw(t) {
ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
sceneHits = [];
if (settingsOpen) { drawSettings(); return; }
if (scene === "game") {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
drawBar(reviewOn ? "Repasar fallos" : MODE_NAME[playMode], { back: "back", actions: [{ id: "reset", icon: "reset" }, { id: "open", icon: "gear" }] });
drawHeaderDark();
if (S.skin !== 1) drawPaper();
drawStaff();
drawNotes();
drawMessage();
drawWheel();
} else {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
if (scene === "menu") drawMenu(t);
else if (scene === "clefs") drawClefs();
else if (scene === "summary") drawSummary();
else if (scene === "stats") drawStats();
drawUpdateBanner();
}
}
let last = performance.now();
function frame(t) {
const dt = Math.min(0.05, (t - last) / 1000);
last = t;
const moving = update(dt);
if (finishAt && performance.now() >= finishAt) { finishAt = 0; finishSession(); }
buildUI();
const hi = settingsOpen || scene !== "game" ? -1 : wheelIndex(pointer);
let hb = "";
for (const b of buttons) if (hit(b, pointer)) { hb = b.id; break; }
if (hi !== hoverIdx || hb !== hoverBtn) { hoverIdx = hi; hoverBtn = hb; dirty = true; }
if (moving || dirty || trans) { drawFrame(t); dirty = false; }
requestAnimationFrame(frame);
}
function onResize() { layout(); dirty = true; }
addEventListener("resize", onResize);
addEventListener("orientationchange", () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
document.addEventListener("fullscreenchange", onResize);
document.addEventListener("webkitfullscreenchange", onResize);
function start() {
loadSettings();
loadSessions();
layout();
syncHist();
if (S.midi) initMidi();
requestAnimationFrame(frame);
}
addEventListener("load", () => {
if (document.fonts && document.fonts.load) {
document.fonts.load("40px Bravura", "\uE050\uE062\uE1D5\uE1D6").then(start, start);
} else start();
});
</script>

@font-face {
  font-family: Bravura;
  src: url("fonts/Bravura.otf") format("opentype"), url("Fonts/Bravura.otf") format("opentype");
}
</style>
